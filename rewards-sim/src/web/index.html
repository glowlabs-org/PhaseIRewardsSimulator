    <div class="tagline">Rewards Simulator</div>
  </header>

  <main class="content">
    <section class="designer">
      <div class="section-title">
        <h2>Input Designer</h2>
        <p>Design competitions: add competitions, add farms, tweak parameters, then run a simulation.</p>
      </div>

      <div class="cards-row" style="grid-template-columns: 1fr;">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Competition</div>
            <div>
              <button id="addCompBtn" class="btn btn-ghost">Add Competition</button>
            </div>
          </div>
          <div class="inline-form">
            <label>Selected competition
              <select id="compSelect"></select>
            </label>
          </div>
        </div>
      </div>

      <div id="farmCards" class="cards-row"></div>
      <div class="designer-actions">
        <button id="simulateBtn" class="btn btn-primary">Simulate rewards</button>
        <button id="sortBtn" class="btn btn-ghost">Sort by first week</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
          <input id="toggleV1" type="checkbox" />
          Import v1 farms
        </label>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section class="visualizer">
      <div class="section-title">
        <h2>Output Visualization</h2>
        <div class="tabs">
          <button id="tabWeek" class="tab active">Per Week</button>
          <button id="tabFarm" class="tab">Per Farm</button>
          <label style="margin-left:auto;display:flex;align-items:center;gap:8px;">
            <span style="font-size:12px;opacity:.8;">Competition</span>
            <select id="vizCompSelect"></select>
          </label>
        </div>
      </div>
      <div id="warnings" class="warnings"></div>

      <div id="perWeek" class="view">
        <div id="weekCards" class="cards-row"></div>
        <div id="weekHeadline" class="cards-row subrow"></div>
        <div id="weekDetails" class="cards-row subrow"></div>
      </div>

      <div id="perFarm" class="view hidden">
        <div id="farmSummaryCards" class="cards-row"></div>
        <div id="farmHeadline" class="cards-row subrow"></div>
        <div id="farmDetails" class="cards-row subrow"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Built with ❤️ for a brighter, cleaner future</span>
